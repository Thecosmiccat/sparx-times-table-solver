<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sparx Solver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Sparx Solver</h1>
      <p class="sub">Works on Sparx Maths in this tab</p>
    </header>

    <label class="field">
      <span>Rounds</span>
      <input id="rounds" type="number" min="1" max="999" value="25" />
    </label>

    <label class="field">
      <span>Delay between questions (ms)</span>
      <input id="delay" type="number" min="200" max="5000" step="50" value="800" />
    </label>

    <div class="btns">
      <button id="start" class="primary">Start</button>
      <button id="stop" class="danger" disabled>Stop</button>
    </div>

    <button id="scan" class="ghost">Scan page now</button>

    <section class="panel">
      <div class="row"><span>Detected</span><strong id="detected">—</strong></div>
      <div class="row"><span>Answer</span><strong id="answer">—</strong></div>
      <div class="row"><span>Progress</span><strong id="progress">0 / 0</strong></div>
      <p id="status" class="status">Open Sparx and click Start</p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
